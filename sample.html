<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample HTML Page</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #ede9fe);
        color: #1e293b;
      }
      main {
        width: min(92vw, 560px);
        padding: 2.5rem;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 50px rgba(30, 41, 59, 0.16);
        text-align: center;
      }
      h1 { margin: 0 0 .5rem; color: #4f46e5; }
      p { line-height: 1.6; }
      button {
        border: 0;
        border-radius: 10px;
        padding: .75rem 1.1rem;
        font: inherit;
        font-weight: 700;
        color: white;
        background: #4f46e5;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
      #message { min-height: 1.5em; margin-top: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, Codex!</h1>
      <p>This is a standalone HTML file. Click the button to test JavaScript in your browser.</p>
      <button id="hello-button">Say hello</button>
      <div id="message" aria-live="polite"></div>
    </main>

    <script>
      document.querySelector('#hello-button').addEventListener('click', () => {
        document.querySelector('#message').textContent = 'Hello! Your sample page is working.';
      });
    </script>
  </body>
</html>
